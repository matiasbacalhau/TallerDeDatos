# Configuración del TP3 (decisiones tomadas con el grupo, 2/11/2026)
entrada: ../archivos                 # CSV diarios del TP1 (solo lectura)
salida: data                         # parquet derivados
horizontes: todos                    # 1-48 h
interpolacion:
  max_horas_hueco: 3                 # se interpola solo si el hueco dura <= 3 h
semilla: 42
validacion:                          # walk-forward (decisión del grupo, 2/11/2026)
  n_pliegues: 4                      # con >60 días de datos: subir a 5-6
  dias_prueba: 5                     # días de cada bloque de prueba (subir a 7 con más datos)
  gap_dias: 2                        # días descartados entre entrenamiento y prueba
  dias_min_entrenamiento: 10
features:                            # decisiones del 2/11/2026: familias 1-4
  alfas_ewma: [0.05, 0.1, 0.2, 0.3]  # memoria del sesgo exponencial; se calibra en validación
  vecinos:                           # familia 5 (10/11/2026): errores recientes de estaciones cercanas
    k: 5
    max_km: 100
calidad:                             # exclusión automática de días (acordado 10/11/2026, ver src/calidad_dias.py)
  max_exceso_pp: 10                  # se excluye si % sin observación > mediana de referencia + 10 pp
  ventana_dias: 14                   # días válidos anteriores que forman la referencia
  min_dias_referencia: 7             # con menos días previos no se excluye nada
  alarma_cobertura_min: 0.70         # alarma si un día incluido tiene cobertura total (real+interpolada) < 70 %
  alarma_dias_utiles_min: 0.70       # alarma si en los últimos 14 días de calendario hay < 70 % de días usables
  dias_historia: 3                   # un día válido tiene «historia incompleta» si falta o se excluyó alguno de
                                     # los 3 días previos: los rezagos llegan hasta 55 h atrás (h=48, +2 h, media de 6)
modelos:                             # decisiones del 10/11/2026 (ver DECISIONES.md, Etapa A — Modelos)
  max_filas_entrenamiento: 2000000   # submuestra aleatoria (semilla) del entrenamiento de cada pliegue
  interpretable:                     # Ridge con curvas (spline); variables por criterio meteorológico
    ridge_alpha: 1.0                 # penalización chica y fija, solo por estabilidad numérica
    umbral_calma_kmh: 10             # enfriamiento nocturno: viento pronosticado < 10 km/h (~3 m/s)
  lgbm:                              # minimizar el error; grilla chica elegida en los pliegues de elección
    num_leaves: [31, 127]            # grilla: complejidad de cada árbol
    objetivos: [regression, regression_l1]   # L2 o L1 (el criterio de elección es MAE)
    max_arboles: 500                 # primera grilla (250-2000, cada 250) dejó el óptimo en el borde
    paso_arboles: 50                 # cortes para elegir la cantidad de árboles
    learning_rate: 0.05              # fijos (valores usuales, no se ajustan)
    min_child_samples: 500           # las filas se repiten por horizonte: hojas con pocas filas son pocas situaciones
    feature_fraction: 0.8
    bagging_fraction: 0.8
    lambda_l2: 1.0
